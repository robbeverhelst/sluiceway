# yaml-language-server: $schema=../../schema/sluiceway.schema.json
#
# Discovery finds an OpenTofu root module only when its files say so: a
# backend block, and a lock file or .tofu files. These two keep their state
# on the local backend, as an example needs no cloud, so each entry with
# tool: opentofu declares one stack, and network runs in two workspaces,
# which files alone never name.

stacks:
  # One root module in two workspaces, each with its own var file. Their
  # stack ids are network:dev and network:prod.
  - path: network
    name: dev
    tool: opentofu
    options:
      workspace: dev
      varFiles: [dev.tfvars]
  - path: network
    name: prod
    tool: opentofu
    options:
      workspace: prod
      varFiles: [prod.tfvars]

  # A root module written in .tofu files, in the default workspace. Its stack
  # id is dns.
  - path: dns
    tool: opentofu
