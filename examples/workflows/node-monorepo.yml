# Pulumi programs in TypeScript, in one repo with a shared package.json, and
# credentials stored as GitHub secrets. Copy it to
# .github/workflows/deploy-dashboard.yml on the default branch, and read
# docs/example-workflows.md for what to change.
#
# `@v0` follows every release until 1.0.0. To review every update yourself,
# pin a full commit SHA instead, as "Pin a commit" in docs/workflow.md says.
name: deploy-dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  issues:
    types: [edited]

permissions:
  contents: read
  issues: write
  deployments: write
  actions: write
  pull-requests: read
  checks: write

jobs:
  sluiceway:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run at a time, and none is dropped. An edit of any other issue gets
    # a group of its own, so it never waits for a scan or a deploy.
    concurrency:
      group: sluiceway-${{ github.event.issue.number }}
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Once for every program in the repo, not once per stack.
      - run: npm ci
      - uses: pulumi/actions@v7
        with:
          pulumi-version: ^3.229.0
      # The providers the programs use. The first run fills the cache.
      - uses: actions/cache@v6
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      # The credentials sit on this step only, so the install scripts of npm ci
      # never see them. They preview and deploy, so they must be able to change
      # things.
      - uses: sluiceway/sluiceway@v0
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
