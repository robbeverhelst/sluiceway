# Credentials and backend settings kept in a secret manager as an env file of
# secret references, loaded once per run with one bulk call. The example uses
# 1Password; docs/credentials.md has the same pattern for other managers.
# Copy it to .github/workflows/deploy-dashboard.yml on the default branch, and
# copy export-env.sh to .github/scripts/export-env.sh.
#
# `@v0` follows every release until 1.0.0. To review every update yourself,
# pin a full commit SHA instead, as "Pin a commit" in docs/workflow.md says.
name: deploy-dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  issues:
    types: [edited]

permissions:
  contents: read
  issues: write
  deployments: write
  actions: write
  pull-requests: read
  checks: write

jobs:
  sluiceway:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run at a time, and none is dropped. An edit of any other issue gets
    # a group of its own, so it never waits for a scan or a deploy.
    concurrency:
      group: sluiceway-${{ github.event.issue.number }}
      queue: max
    # An environment that only the default branch may use, which holds the
    # token of the secret manager.
    environment:
      name: sluiceway
      deployment: false
    steps:
      - uses: actions/checkout@v7
      - uses: pulumi/actions@v7
        with:
          pulumi-version: ^3.229.0
      # Leave this out when op is part of your runner image.
      - uses: 1password/install-cli-action@v4
      # One `op run` resolves the whole file. The service account can see only
      # the vault with the credentials Sluiceway previews and deploys with.
      - name: Load the environment
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: op run --env-file=ci/deploy.env --no-masking -- bash .github/scripts/export-env.sh ci/deploy.env
      - uses: sluiceway/sluiceway@v0
