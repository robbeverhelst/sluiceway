# Cloud credentials through OpenID Connect, so no cloud key is stored anywhere,
# and the Pulumi state in a bucket of the same cloud. The example uses AWS;
# docs/credentials.md says what changes for other clouds. Copy it to
# .github/workflows/deploy-dashboard.yml on the default branch.
#
# `@v0` follows every release until 1.0.0. To review every update yourself,
# pin a full commit SHA instead, as "Pin a commit" in docs/workflow.md says.
name: deploy-dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  issues:
    types: [edited]

permissions:
  contents: read
  issues: write
  deployments: write
  actions: write
  pull-requests: read
  checks: write
  id-token: write

jobs:
  sluiceway:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run at a time, and none is dropped. An edit of any other issue gets
    # a group of its own, so it never waits for a scan or a deploy.
    concurrency:
      group: sluiceway-${{ github.event.issue.number }}
      queue: max
    # An environment that only the default branch may use. The role's trust
    # policy names it (the `environment:<name>` subject), so no other branch
    # can assume the role.
    environment:
      name: sluiceway
      deployment: false
    steps:
      - uses: actions/checkout@v7
      - uses: pulumi/actions@v7
        with:
          pulumi-version: ^3.229.0
      # A role that previews and deploys, so it can change things.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: sluiceway/sluiceway@v0
        env:
          PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
