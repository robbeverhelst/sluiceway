name: Sluiceway
description: One GitHub issue that shows which infrastructure stacks have changes waiting, and deploys a stack when someone ticks its box.
author: Sluiceway

# How the Marketplace shows the action: a Feather icon on one of GitHub's
# colours. Water through an open gate.
branding:
  icon: droplet
  color: blue

inputs:
  mode:
    description: >-
      What this step does. One of: auto, scan, resolve, apply, settle, check, init. Leave it out
      for auto, which reads the event of the run and does what it asks for, so one job with this
      one step runs the whole loop: a push to the default branch and the schedule scan, an edit of
      the dashboard resolves the ticks, deploys what it started and settles, a dispatch resolves
      and scans, a pull request runs the check, and any other event ends with a notice. Set
      another mode for the split workflow, where each mode is a job of its own.
    required: false
    default: auto
  concurrency:
    description: >-
      How many previews a scan runs at the same time. Leave it out and the scan runs one preview
      for each core of the machine, up to 8, and says in the job log which number it used. It
      belongs to the runner, not to the repo, so it is an input and not a config key.
    required: false
  preview-timeout:
    description: >-
      Time limit for one preview, in minutes. A preview that runs longer is stopped and its stack
      gets a preview failure row.
    required: false
    default: "10"
  strict:
    description: >-
      scan only. true turns the job red when any preview failed, after the dashboard is written.
      Off by default, because a job that is red for one broken stack on every push teaches people
      to ignore red.
    required: false
    default: "false"
  github-token:
    description: >-
      The GITHUB_TOKEN of the workflow run. Leave it at the default. Sluiceway always acts as the
      workflow's own token, and a GitHub App token or a personal access token is not supported.
      The check mode reads files only and never uses it.
    required: false
    default: ${{ github.token }}
  deployment-id:
    description: >-
      Required in apply mode and an error in every other mode. The deployment record to deploy:
      the deployment field of a matrix entry of resolve.
    required: false
  dry-run:
    description: >-
      apply only. true rehearses a tick: the deployment record, the fresh preview and the hash
      check run as for a deploy, and then nothing is deployed. The record ends as inactive,
      "rehearsed, nothing was deployed", and the job is green.
    required: false
    default: "false"
  backend:
    description: >-
      check only. true also asks the backend which of the stacks it found the backend holds, with
      the credentials the job loaded before this step, and gives a ready-to-paste ignore block for
      the ones it does not. It runs the tool for that one question and nothing else.
    required: false
    default: "false"
  deploy-timeout:
    description: >-
      apply only. A time limit on the deploy itself, in whole minutes. When it runs out the tool is
      interrupted, gets two minutes to stop by itself, and the deploy fails with a reason that says
      so. The stack may then be half deployed. Empty by default: no limit of Sluiceway's, and the
      job's own timeout-minutes is the limit.
    required: false
  env-file:
    description: >-
      scan, apply, auto, and check with backend: true. A file of NAME=value lines, relative to the
      checkout or absolute, that Sluiceway reads once for the infrastructure tool's process: every
      value is masked in the job log before anything else, and the file wins over a variable the
      job already has. The file may hold plain values or what a step before this one resolved;
      Sluiceway resolves no secret reference. Empty by default: the tool gets the job environment
      as it is. On a step that never runs the tool the file is not read.
    required: false
  slack-webhook-url:
    description: >-
      scan, resolve and apply. The address of a Slack incoming webhook, from a secret of the repo.
      Sluiceway posts a short message there on the events notify.events in sluiceway.yaml lists.
      Empty by default: nothing is sent.
    required: false
  telegram-bot-token:
    description: >-
      scan, resolve and apply. The token of a Telegram bot, from a secret. Needs telegram-chat-id
      too. Empty by default: nothing is sent.
    required: false
  telegram-chat-id:
    description: >-
      scan, resolve and apply. The chat the Telegram bot posts to: a chat id or the @ name of a
      public channel. Empty by default.
    required: false
  webhook-url:
    description: >-
      scan, resolve and apply. An http or https address, from a secret, that gets a small JSON
      message on the same events: the event, the repository, the stack ids and the links. Empty
      by default: nothing is sent.
    required: false
  job-id:
    description: >-
      Leave it at the default. The id of the running job, which GitHub gives no step in any other
      way. Links on the dashboard use it to land on this job's log.
    required: false
    default: ${{ job.check_run_id }}

outputs:
  matrix:
    description: >-
      Set by resolve and scan. A JSON list with one { stack, environment, deployment } entry per
      deploy it started, or []. Hand it to the matrix of the apply job. A scan starts a deploy
      for a pull request merged from the dashboard (mergeAndDeploy), and the scan of a push to the
      default branch for each stack set to deploy: on-merge.
  dashboard-url:
    description: >-
      Set by scan, apply and settle. The web address of the dashboard issue. Empty when the step
      never got as far as finding it.
  pending:
    description: >-
      Set by scan. The number of pending stacks on the dashboard after this scan. 0 when the scan
      failed before it wrote the dashboard.
  preview-failed:
    description: >-
      Set by scan. The number of stacks on the dashboard whose preview failed. 0 when the scan
      failed before it wrote the dashboard.
  in-sync:
    description: >-
      Set by scan. The number of stacks on the dashboard that are in sync. 0 when the scan failed
      before it wrote the dashboard.
  dashboard-changed:
    description: >-
      Set by scan. true when this scan wrote a body that differs from the one before, false
      otherwise, so a notify step can stay quiet when nothing changed.
  outcome:
    description: >-
      Set by apply. deployed, in-sync (the fresh preview had nothing to deploy), rehearsed
      (dry-run stopped after the check of the hash), refused (the
      change moved since the tick, the deployment record was not one this job may deploy, or
      deploys are turned off) or failed.
  stack:
    description: >-
      Set by apply. The stack id this job handled. Empty when the job never learned it.
  result-file:
    description: >-
      Set by scan and apply. The path, under RUNNER_TEMP, of a JSON file with what the summary
      holds: no property value and none of the tool's own words. Sluiceway does not upload it.

runs:
  using: node24
  main: dist/index.js
  # Only after auto mode: a run that was stopped after it handed a deploy on
  # and before it settled gets its deploys settled here. Otherwise it does
  # nothing.
  post: dist/post.js
  post-if: always()
