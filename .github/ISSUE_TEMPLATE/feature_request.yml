name: Feature request
description: Something Sluiceway should do and does not.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [what is not in v1](https://docs.sluiceway.dev/not-in-v1/) first. It lists what was left out of v1 on purpose, and what was rejected and why.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How should it work for the person using it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: A workaround, another tool, or nothing.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I read what is not in v1, and this is not listed under "Rejected on principle".
          required: true
