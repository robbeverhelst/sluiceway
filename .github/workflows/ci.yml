name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Check that schema/ is up to date
        run: |
          if ! bun run check:schema; then
            echo "::error::schema/ does not match the source. Run 'bun run build:schema' and commit the result."
            exit 1
          fi

      - name: Check that dist/ is up to date
        run: |
          if ! bun run check:dist; then
            echo "::error::dist/ does not match the source. Run 'bun run build' and commit the result."
            exit 1
          fi

  fixtures:
    # Runs the fixture recorder with the real CLI: the minimum version that
    # record 0001 supports and the newest one the fixtures were recorded with.
    # The recorder fails when a scenario does not show what it is for, or when
    # output that should be JSON does not parse. The tool only ever runs against
    # a copy of examples/pulumi-basic with a file backend in a temp directory.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pulumi: [v3.229.0, v3.263.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The TypeScript program of the example runs on Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Without a command this only installs the CLI.
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: ${{ matrix.pulumi }}

      - run: bun install --frozen-lockfile

      - name: Record the fixtures
        env:
          PULUMI_VERSION: ${{ matrix.pulumi }}
        run: bun run record:fixtures --out "$RUNNER_TEMP/fixtures" --expect-version "$PULUMI_VERSION"

      # The fixtures in the repo come from here, so that the paths in them are
      # a runner's and not a person's. See CONTRIBUTING.md.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fixtures-${{ matrix.pulumi }}
          path: ${{ runner.temp }}/fixtures
          retention-days: 7
          if-no-files-found: error

  fixtures-opentofu:
    # The same for OpenTofu (record 0053): the recorder with the real tofu,
    # the minimum version the adapter supports and the newest one the
    # fixtures were recorded with. tofu only ever runs against a copy of
    # examples/opentofu-basic, with its state in the local backend inside a
    # temp directory. Providers come from the OpenTofu registry.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tofu: ["1.11.0", "1.12.6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # No wrapper: the recorder needs what tofu itself prints.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.tofu }}
          tofu_wrapper: false

      - run: bun install --frozen-lockfile

      - name: Record the fixtures
        env:
          TOFU_VERSION: ${{ matrix.tofu }}
        run: bun run record:fixtures --tool opentofu --out "$RUNNER_TEMP/fixtures" --expect-version "v$TOFU_VERSION"

      # The fixtures in the repo come from here. See CONTRIBUTING.md.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fixtures-opentofu-v${{ matrix.tofu }}
          path: ${{ runner.temp }}/fixtures
          retention-days: 7
          if-no-files-found: error

  fixtures-terraform:
    # The same for Terraform behind the OpenTofu adapter (record 0068): the
    # recorder with the real terraform, the minimum version the adapter
    # supports and the newest one the fixtures were recorded with, on a copy
    # of examples/opentofu-basic with its state in the local backend.
    # Providers come from the Terraform registry.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.14.0", "1.16.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # No wrapper: the recorder needs what terraform itself prints.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - run: bun install --frozen-lockfile

      - name: Record the fixtures
        env:
          TERRAFORM_VERSION: ${{ matrix.terraform }}
        run: bun run record:fixtures --tool terraform --out "$RUNNER_TEMP/fixtures" --expect-version "v$TERRAFORM_VERSION"

      # The fixtures in the repo come from here. See CONTRIBUTING.md.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fixtures-terraform-v${{ matrix.terraform }}
          path: ${{ runner.temp }}/fixtures
          retention-days: 7
          if-no-files-found: error

  fixtures-terragrunt:
    # The same for Terragrunt in front of tofu (record 0068): one unit of
    # examples/terragrunt-basic, with the minimum terragrunt the adapter
    # supports and the newest one the fixtures were recorded with. Terragrunt
    # has no setup action of its own, so its release binary is downloaded and
    # checked against the release's SHA256SUMS.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terragrunt: [v1.0.0, v1.1.6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Install terragrunt
        env:
          TERRAGRUNT_VERSION: ${{ matrix.terragrunt }}
        run: scripts/ci/install-terragrunt.sh "$TERRAGRUNT_VERSION" "$RUNNER_TEMP/terragrunt"

      - run: bun install --frozen-lockfile

      - name: Record the fixtures
        env:
          TERRAGRUNT_VERSION: ${{ matrix.terragrunt }}
        run: bun run record:fixtures --tool terragrunt --out "$RUNNER_TEMP/fixtures" --expect-version "$TERRAGRUNT_VERSION"

      # The fixtures in the repo come from here. See CONTRIBUTING.md.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fixtures-terragrunt-${{ matrix.terragrunt }}
          path: ${{ runner.temp }}/fixtures
          retention-days: 7
          if-no-files-found: error

  fixtures-cdktf:
    # The same for CDK for Terraform in front of tofu (record 0068): cdktf
    # synth of examples/cdktf-basic, then tofu in the directory of one of its
    # stacks. cdktf's last release is its only version: HashiCorp archived it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cdktf: ["0.21.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Install cdktf and the packages of the example
        env:
          CDKTF_VERSION: ${{ matrix.cdktf }}
        run: |
          npm install --global "cdktf-cli@$CDKTF_VERSION"
          npm ci --prefix examples/cdktf-basic

      - run: bun install --frozen-lockfile

      - name: Record the fixtures
        env:
          CDKTF_VERSION: ${{ matrix.cdktf }}
        run: bun run record:fixtures --tool cdktf --out "$RUNNER_TEMP/fixtures" --expect-version "v$CDKTF_VERSION"

      # The fixtures in the repo come from here. See CONTRIBUTING.md.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fixtures-cdktf-v${{ matrix.cdktf }}
          path: ${{ runner.temp }}/fixtures
          retention-days: 7
          if-no-files-found: error

  fixtures-helm:
    # The same for Helm (record 0058): the recorder with the real helm and its
    # diff plugin, the minimum versions the adapter supports and the newest
    # ones the fixtures were recorded with. Helm compares a chart with a
    # release in a cluster, so the job makes a kind cluster of its own, and
    # helm only ever reaches that one, with a copy of examples/helm-basic.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - helm: v3.18.0
            diff: v3.15.11
          - helm: v4.3.0
            diff: v3.15.13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}

      # Helm 4 checks a plugin's signature unless told not to, and helm 3
      # knows no such flag.
      - name: Install the diff plugin
        env:
          HELM_VERSION: ${{ matrix.helm }}
          DIFF_VERSION: ${{ matrix.diff }}
        run: |
          verify=""
          case "$HELM_VERSION" in v4.*) verify="--verify=false" ;; esac
          helm plugin install https://github.com/databus23/helm-diff --version "$DIFF_VERSION" $verify
          echo "HELM_PLUGINS=$(helm env HELM_PLUGINS)" >> "$GITHUB_ENV"

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: sluiceway-fixtures

      - run: bun install --frozen-lockfile

      - name: Record the fixtures
        env:
          HELM_VERSION: ${{ matrix.helm }}
        run: KUBECONFIG="$HOME/.kube/config" bun run record:fixtures --tool helm --out "$RUNNER_TEMP/fixtures" --expect-version "$HELM_VERSION"

      # The fixtures in the repo come from here. See CONTRIBUTING.md.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fixtures-helm-${{ matrix.helm }}
          path: ${{ runner.temp }}/fixtures
          retention-days: 7
          if-no-files-found: error

  fixtures-kubectl:
    # The same for Kubernetes manifests (record 0060): the recorder with the
    # real kubectl, the minimum version the adapter supports and the newest
    # one the fixtures were recorded with. A diff compares with live objects,
    # so the job makes a kind cluster of its own, with a node of the same
    # minor version as its kubectl, and kubectl only ever reaches that one,
    # with a copy of examples/kubernetes-basic. The recorder refuses any
    # context that is not a kind cluster.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubectl: v1.34.0
            node: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - kubectl: v1.37.0
            node: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Installs kind and this kubectl, and makes the cluster.
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: sluiceway-fixtures
          node_image: ${{ matrix.node }}
          kubectl_version: ${{ matrix.kubectl }}

      - run: bun install --frozen-lockfile

      - name: Record the fixtures
        env:
          KUBECTL_VERSION: ${{ matrix.kubectl }}
        run: KUBECONFIG="$HOME/.kube/config" bun run record:fixtures --tool kubectl --out "$RUNNER_TEMP/fixtures" --expect-version "$KUBECTL_VERSION"

      # The fixtures in the repo come from here. See CONTRIBUTING.md.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fixtures-kubectl-${{ matrix.kubectl }}
          path: ${{ runner.temp }}/fixtures
          retention-days: 7
          if-no-files-found: error

  smoke:
    # Runs the committed bundle the way a consumer would: a `uses:` step, read
    # through action.yml, on the runner's own node24. The e2e workflow proves
    # that a scan works. This job proves the one thing e2e cannot, because e2e
    # has to start the bundle itself to point it at the fake GitHub.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: action

      # The check reads files and talks to nobody (record 0042), so it runs for
      # real: on this workspace, which holds this repo and its example project
      # under action/, it has to pass.
      - name: The check passes on a valid workspace
        uses: ./action
        with:
          mode: check

      # A real step can only talk to the real GitHub, and a scan that works
      # would write a dashboard issue into this repo. So the scan runs in a
      # workspace whose sluiceway.yaml is broken on purpose. A config error
      # fails the job before the tool or GitHub is touched (record 0012), and
      # to get there the bundle has loaded, read `mode` and the defaults of
      # action.yml, and read the workspace.
      - name: A workspace with a broken sluiceway.yaml
        run: |
          printf 'tickerz: write\n' > sluiceway.yaml

      - id: scan
        uses: ./action
        continue-on-error: true
        with:
          mode: scan

      - name: Expect the scan to fail on the config
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected the scan to fail on the broken sluiceway.yaml, got: $OUTCOME"
            exit 1
          fi

      - id: check
        uses: ./action
        continue-on-error: true
        with:
          mode: check

      - name: Expect the check to fail on the config
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected the check to fail on the broken sluiceway.yaml, got: $OUTCOME"
            exit 1
          fi
