name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # The committed bundle on a real runner, with the real CLI, the example
    # project and the fake GitHub server (build plan, section 6). A full scan
    # and a narrowed one, then the whole loop: ticks, resolve, apply with the
    # real tool and settle, with a refused tick, a cancelled deploy, a
    # rehearsal, a stack deployed by hand so that nothing is left to deploy,
    # and a re-run. Last, a scan started the way a runner starts
    # `uses: sluiceway/sluiceway@v0`, from a moving tag (hotfix 0.1.1).
    #
    # The bundle is started by scripts/e2e.ts and not by a `uses: ./` step. A
    # runner sets GITHUB_API_URL, GITHUB_WORKSPACE, GITHUB_SHA and
    # GITHUB_EVENT_NAME itself and lets neither a step nor a job replace them,
    # so a real step can only ever talk to the real GitHub. The script hands
    # the bundle what a runner would: the inputs with the defaults of
    # action.yml, and the GITHUB_* variables, with the fake server as GitHub.
    # The smoke job of ci.yml is the `uses: ./` half.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The minimum version that record 0001 supports and the newest one the
        # fixtures were recorded with.
        pulumi: [v3.229.0, v3.263.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Stands in for the runner's own node24, which starts the bundle in a
      # real step. It also runs the TypeScript program of the example.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Without a command this only installs the CLI.
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: ${{ matrix.pulumi }}

      - run: bun install --frozen-lockfile

      - name: Scan, tick, resolve, apply and settle the example project with the committed bundle
        env:
          PULUMI_VERSION: ${{ matrix.pulumi }}
        run: bun run e2e --work-dir "$RUNNER_TEMP/e2e" --expect-version "$PULUMI_VERSION"

  mixed:
    # One repo with Pulumi, OpenTofu and Helm stacks (records 0053 and 0058):
    # the committed bundle, the real pulumi, tofu and helm with its diff
    # plugin, a kind cluster made for this job, and the fake GitHub server. A
    # full scan with the rows of all three tools, a deploy of an OpenTofu
    # stack from the plan its fresh preview saved, a change that moved after
    # its tick, a deploy of a Pulumi stack, a Helm release whose values moved
    # after its tick and then deploys, and a last scan. tofu and helm run with
    # the minimum versions the adapters support and the newest ones the
    # fixtures were recorded with.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - tofu: "1.11.0"
            helm: v3.18.0
            diff: v3.15.11
          - tofu: "1.12.6"
            helm: v4.3.0
            diff: v3.15.13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Stands in for the runner's own node24, which starts the bundle in a
      # real step.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Without a command this only installs the CLI.
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: v3.263.0

      # No wrapper: Sluiceway reads what tofu itself prints.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.tofu }}
          tofu_wrapper: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}

      # Helm 4 checks a plugin's signature unless told not to, and helm 3
      # knows no such flag.
      - name: Install the diff plugin
        env:
          HELM_VERSION: ${{ matrix.helm }}
          DIFF_VERSION: ${{ matrix.diff }}
        run: |
          verify=""
          case "$HELM_VERSION" in v4.*) verify="--verify=false" ;; esac
          helm plugin install https://github.com/databus23/helm-diff --version "$DIFF_VERSION" $verify
          echo "HELM_PLUGINS=$(helm env HELM_PLUGINS)" >> "$GITHUB_ENV"

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: sluiceway-e2e

      - run: bun install --frozen-lockfile

      - name: Scan, tick, apply and settle a repo with three tools with the committed bundle
        env:
          TOFU_VERSION: ${{ matrix.tofu }}
          HELM_VERSION: ${{ matrix.helm }}
        run: KUBECONFIG="$HOME/.kube/config" bun run e2e:mixed --work-dir "$RUNNER_TEMP/e2e-mixed" --expect-tofu "v$TOFU_VERSION" --expect-helm "$HELM_VERSION"
